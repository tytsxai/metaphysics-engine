name: 能力建议 / Feature request
description: 想补一门术数、一个接口、或 Agent 接入能力
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        先确认一下项目边界，能省下很多来回：BaZi Master 是一个**算法能力层**，
        没有前端、没有账号系统、没有数据库，且刻意**不把「断语」塞进引擎**
        （庙旺利陷、奇门格局吉凶、神煞轻重各家出入极大，留给调用方）。

        这几类改动通常不会被接受，但欢迎讨论：塞前端 / 加回账号与数据库 /
        硬编码断语 / 为迎合某一流派改默认口径。详见
        [CONTRIBUTING.md](https://github.com/tytsxai/bazi-master/blob/main/CONTRIBUTING.md)。

  - type: dropdown
    id: kind
    attributes:
      label: 类型 / Type
      options:
        - 补一门新的术数能力
        - 现有术数补字段或补细节
        - 接口 / OpenAPI 契约改进
        - '`./bazi` CLI 能力'
        - Agent 接入（tool schema、MCP、Runtime 适配）
        - 运维与可观测性
        - 文档 / 翻译
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题 / What problem does this solve
      description: 描述你实际卡在哪里，而不只是想要什么功能。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 设想的形态 / Proposed shape
      description: 接口长什么样？CLI 命令怎么调？输出包含什么？
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: 取法依据 / Algorithmic source
      description: |
        如果是新增术数能力，**这一条是必需的**：依据哪本典籍、哪个流派？
        有流派分歧的地方打算怎么选？没有明确依据的算法我们没法验证，也就没法合入。
