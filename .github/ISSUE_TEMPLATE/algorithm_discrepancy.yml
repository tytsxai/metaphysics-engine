name: 排盘口径问题 / Algorithm discrepancy
description: 引擎排出来的盘和你认为正确的不一样（八字、紫微、六爻、六壬、奇门、风水、择吉、姓名）
title: '[算法] '
labels: ['algorithm', 'needs-verification']
body:
  - type: markdown
    attributes:
      value: |
        这是本项目最有价值的一类 issue —— 这些算法**错了也不会报错**，只会安静地给出一张错盘。

        提之前请先分清两种情况：
        - **算错了**（三传漏宗门、纳甲干支排错）→ 是 bug，我们修
        - **流派不同**（闰月归本月 vs 折半、晚子时换不换日）→ 不是 bug，我们就地注明口径，不改默认

        已知的口径选择逐条写在 [.claude/skills/bazi-cli/SKILL.md](https://github.com/tytsxai-stack/metaphysics-engine/blob/main/.claude/skills/bazi-cli/SKILL.md)，
        请先扫一眼，可能你遇到的正是一个已注明的流派选择。

  - type: dropdown
    id: module
    attributes:
      label: 哪一门术数 / Which module
      options:
        - 八字 BaZi
        - 紫微斗数 Zi Wei Dou Shu
        - 六爻纳甲 Liu Yao
        - 大六壬 Da Liu Ren
        - 奇门遁甲 Qi Men Dun Jia
        - 八宅风水 Ba Zhai
        - 择吉黄历 Almanac
        - 姓名五格 Name grids
        - 合盘 Synastry
        - 周易 I Ching
        - 塔罗 Tarot
        - 星座 Zodiac
        - 节气 / 历法基础 Jieqi & calendar
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: 你判断这是 / You believe this is
      options:
        - 算错了（有唯一正确答案）/ A bug — there is one correct answer
        - 流派不同（各家取法不一）/ A school difference
        - 不确定 / Not sure
    validations:
      required: true

  - type: textarea
    id: input
    attributes:
      label: 完整输入 / Full input
      description: 请给出可复现的完整输入。起课类务必给全日期时辰，否则取引擎当日、结果不可复现。
      placeholder: |
        ./bazi calc bazi --birth 1990-05-20T14:30 --gender male --json

        或：
        curl -X POST http://127.0.0.1:4000/api/liuren/chart \
          -H "Content-Type: application/json" \
          -d '{"date":"2024-05-20","hour":14}'
      render: bash
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 引擎当前输出 / Actual output
      description: 贴 `--json` 输出里相关的部分即可，不用全贴。
      render: json
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 你认为正确的输出 / Expected output
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: 依据 / Source
      description: |
        **这一条最关键。** 依据的典籍、流派、或对照的排盘工具是什么？
        没有依据的「我觉得不对」很难推进。
      placeholder: |
        例：《六壬大全》涉害课取法；或 xx 排盘软件同输入的结果；或某门派口传取法
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本 / Version
      description: '`git rev-parse --short HEAD` 或 release tag'
