name: Bug 报告 / Bug report
description: 服务、接口、CLI 或部署上的问题（排盘结果本身的问题请用「排盘口径问题」模板）
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        提之前先跑一下 `./bazi doctor --json` —— 环境类问题它多半会直接告诉你答案，
        并给出可以粘贴执行的修复命令。

        **安全漏洞不要开公开 issue**，见 [SECURITY.md](https://github.com/tytsxai-stack/metaphysics-engine/blob/main/SECURITY.md)。

  - type: dropdown
    id: area
    attributes:
      label: 出问题的位置 / Area
      options:
        - HTTP API（接口行为、响应、错误）
        - '`./bazi` CLI'
        - 引擎起停 / stack（起不来、停不掉、端口）
        - 环境与配置（.env、doctor、setup）
        - 部署与生产（Docker、反代、健康检查、优雅停机）
        - 测试与 CI
        - 文档
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 请给出完整命令。CLI 问题请附 `--json` 输出，HTTP 问题请附完整 curl 与响应。
      render: bash
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果 / Expected
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果 / Actual
      description: 报错信息、退出码、日志（`./bazi stack logs --tail 60`）。
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: '`./bazi doctor --json` 输出'
      description: 环境相关问题请务必附上；纯文档问题可留空。
      render: json

  - type: input
    id: env
    attributes:
      label: 环境 / Environment
      placeholder: 'Node 20.11 / macOS 14 / commit abc1234'
    validations:
      required: true
